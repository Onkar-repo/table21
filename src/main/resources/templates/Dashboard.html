<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table21</title>
	<link rel="stylesheet" href="/css/newitem.css">
	<link rel="stylesheet" href="/css/dashboard.css">
    <script type="text/javascript" src="/js/dashboard.js"></script>
</head>
<body onload="loadUserName();">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h3 style="margin-top:0; color: var(--primary); font-size: 1.1rem; margin-bottom: 10px;">Table Map</h3>
        <div class="table-grid">
            <button type="button" class="table-btn active" id="t1" onblur="">1</button>
            <button type="button" class="table-btn">2</button>
            <button type="button" class="table-btn">3</button>
            <button type="button" class="table-btn">4</button>
            <button type="button" class="table-btn">5</button>
            <button type="button" class="table-btn">6</button>
            <button type="button" class="table-btn">7</button>
            <button type="button" class="table-btn">8</button>
            <button type="button" class="table-btn">9</button>
            <button type="button" class="table-btn">10</button>
            <button type="button" class="table-btn">11</button>
            <button type="button" class="table-btn">12</button>
            <button type="button" class="table-btn">13</button>
            <button type="button" class="table-btn">14</button>
            <button type="button" class="table-btn">15</button>
            <button type="button" class="table-btn">16</button>
            <button type="button" class="table-btn">17</button>
            <button type="button" class="table-btn">18</button>
            <button type="button" class="table-btn">19</button>
            <button type="button" class="table-btn">20</button>
			<button type="button" class="table-btn">21</button>
			<button type="button" class="table-btn">22</button>
			<button type="button" class="table-btn">23</button>
			<button type="button" class="table-btn">24</button>
			<button type="button" class="table-btn">25</button>
        </div>

        <div class="admin-actions">
            <button type="button" class="action-btn" onclick="toggleModal();">Register Items</button>
            <button type="button" class="action-btn">Delete Items</button>
            <button type="button" class="action-btn">Edit Items</button>
            <button type="button" class="action-btn">Enlist Items</button>
            <button type="button" class="action-btn">Show Reports</button>
            <button type="button" class="action-btn" onclick="closeTable();">Close Table</button>
            <button type="button" class="action-btn" style="grid-column: span 2; background: #95a5a6;" onclick="location.reload()">Log Out</button>
        </div>
        
        <div class="user-info">
            <strong id="ue">ramchandra123@gmail.com</strong> • Status: Ready
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="order-header">
            <div>
                <span><span style="color:#888">Date:</span> <strong id="dt">01.10.2025</strong></span>
                <span><span style="color:#888">Inv:</span> <strong id="num">123456789</strong></span>
            </div>
            <div>
                <span><span style="color:#888">Table:</span><strong style="font-size: 1.1rem;" id="tab">10</strong></span>
                <span class="badge badge-occupied" id="stat">Occupied</span>
                <span class="badge" style="background:#fab1a0; color:#c0392b;" id="pmt">Pending</span>
            </div>
        </header>

        <section class="input-section">
            <div class="form-group">
                <label>Item Code</label>
                <input type="text" placeholder="Type & Tab" id="itmcode">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Item Name</label>
                <select  id="itmlist">
                    <option>Select an item...</option>
                    <option selected>Paneer Tikka Butter Masala</option>
                    <option>Butter Naan</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" placeholder="Type & Enter" value="1"  id="qty">
            </div>
            <div class="form-group">
                <label>Remove By Ref</label>
                <input type="text" placeholder="Type & Enter"  id="srno">
            </div>
        </section>

        <section class="bill-container">
            <div class="bill-header">
                <span>Ref</span>
                <span>Qty</span>
                <span>Description</span>
                <span style="text-align:right">Amount</span>
            </div>
            <div class="bill-items"  id="itemlist">
                <div class="bill-row"  id="1">
                    <span>01</span>
                    <span>02</span>
                    <span>Paneer Tikka Butter Masala</span>
                    <span style="text-align:right">540.00</span>
                </div>
                <div class="bill-row" id="2">
                    <span>02</span>
                    <span>04</span>
                    <span>Butter Naan (Garlic)</span>
                    <span style="text-align:right">180.00</span>
                </div>
				<!-- Row Entry Started-->
                <div class="bill-row" id="3">
                    <span>03</span>
                    <span>06</span>
                    <span>Matki Usal spicy</span>
                    <span style="text-align:right">540.00</span>
                </div>
				<!-- Row Entry Finished-->
            </div>
            <div class="bill-footer">
                <span>Grand Total</span>
                <span class="total-amount" id="total">₹ 720.00</span>
            </div>
        </section>

        <div class="footer-actions">
            <button type="button" class="btn-lg btn-print" id="printButton">Print</button>
            <button type="button" class="btn-lg btn-clear" id="clearButton">Clear</button>
            <button type="button" class="btn-lg btn-complete" id="completeButton">Complete</button>
        </div>
    </main>

    <!-- Register Item Pop-up -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-form">
            <div class="modal-header">
                <span>Register New Item</span>
                <button style="background:none; border:none; color:white; cursor:pointer; font-size:1.2rem;" onclick="toggleModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>Item Name</label>
                    <input type="text" id="newItemName">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex:1">
                        <label>Code</label>
                        <input type="text" id="newItemCode">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Price</label>
                        <input type="number" id="newItemPrice">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="action-btn" style="background:#7f8c8d; padding: 8px 15px;" onclick="toggleModal()">Cancel</button>
				<button type="button" class="action-btn" style="background:#7f8c8d; padding: 8px 15px;" onclick="toggleModal()">Add To Cart (0)</button>
				<button type="button" class="action-btn" style="background:var(--success); padding: 8px 15px;" onclick="saveItem()">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
