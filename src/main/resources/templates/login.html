<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
	<link rel="stylesheet" href="/css/alert.css">
	<link rel="stylesheet" href="/css/login.css">
	<link rel="stylesheet" href="/css/yesno.css">
</head>
<body onLoad="document.getElementById('reg_email').focus()">

	<!-- Custom Alert Modal Container -->
		<div class="dialog-overlay" id="customAlertOverlay">
			<div class="dialog-card">
				<div class="dialog-icon-container">
					<div class="dialog-icon-badge">!</div>
				</div>

				<h2 class="dialog-title" id="alertTitle">Alert Title</h2>
				<p class="dialog-subtitle" id="alertMessage">This is an important alert notification message.</p>

				<div class="dialog-actions">
					<button class="btn-dialog btn-primary" id="alertOkBtn" onclick="closeAlert()">OK</button>
				</div>
			</div>
		</div>

		<!-- Custom Dialog Modal Container -->
		    <div class="dialog-overlay" id="customDialogOverlay">
		        <div class="dialog-card">
		            <div class="dialog-icon-container">
		                <div class="dialog-icon-badge">?</div>
		            </div>

		            <h2 class="dialog-title">Confirmation</h2>
		            <p class="dialog-subtitle">You will receive the password on the registered email. It may take couple of seconds delay. Proceed ?</p>

		            <div class="dialog-actions">
		                <button class="btn-dialog btn-secondary" onclick="handleResponse(false)">No</button>
		                <button class="btn-dialog btn-primary" id="dialogYesBtn" onclick="handleResponse(true)">Yes</button>
		            </div>
		        </div>
		    </div>
	
    <div class="login-card">
        <div class="logo-container">
            <div class="logo-badge">T</div>
        </div>
		
		<h1 class="form-title">Log In</h1>
        <p class="form-subtitle">Authenticate to begin</p>


        <div class="form-group">
            <input type="email" value="" placeholder="Email" id="reg_email" name="Email" autocomplete="email">
        </div>
        
        <div class="form-group">
            <input type="password" value="" placeholder="Password" id="reg_password" name="Password" autocomplete="current-password">
        </div>

        <button type="button" class="btn-primary" onclick="validateLogIn()">Log In</button>
        <button type="button" class="btn-secondary" onclick="redirectToSignup();">Sign Up</button>

        <div>
            <a class="forgot-password" id="label_7019960e" onclick="showDialog();">Forgot Password?</a>
        </div>
    </div>

    <script type="text/javascript" src="/js/login.js">
       
    </script>
</body>
</html>
