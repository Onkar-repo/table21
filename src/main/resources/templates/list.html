<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item List</title>
    <style>
        /* Modern Reset & Professional Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f4f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Responsive Container Card */
        .list-card {
            background: #ffffff;
            width: 100%;
            max-width: 650px; /* Expanded for comfortable table viewing */
            padding: 36px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
            text-align: center;
        }

        /* Logo Icon ("T") styling */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-badge {
            background: #65407D; /* Modern corporate purple */
            color: #ffffff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(101, 64, 125, 0.3);
        }

        /* Form Header Text */
        .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 24px;
        }

        /* Owner Heading Banner */
        .owner-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-left: 4px solid #65407D;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }

        .owner-banner .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            font-weight: 600;
        }

        .owner-banner .user-name {
            font-size: 15px;
            color: #1f2937;
            font-weight: 700;
        }

        /* Table Styles */
        .table-container {
            width: 100%;
            overflow-x: auto; /* Handles responsiveness on smaller screens */
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .custom-table th {
            background-color: #f9fafb;
            color: #4b5563;
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        .custom-table td {
            padding: 14px 16px;
            color: #1f2937;
            border-bottom: 1px solid #e5e7eb;
            transition: background-color 0.2s ease;
        }

        .custom-table tbody tr:last-child td {
            border-bottom: none;
        }

        .custom-table tbody tr:hover td {
            background-color: #f4f4f7;
        }

        /* Monospace font style for item codes */
        .code-tag {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: rgba(101, 64, 125, 0.08);
            color: #65407D;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Footer Link */
        .login-redirect {
            display: inline-block;
            margin-top: 24px;
            color: #6b7280;
            font-size: 14px;
            text-decoration: none;
        }

        .login-redirect a {
            color: #65407D;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .login-redirect a:hover {
            text-decoration: underline;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                background: #ffffff;
            }
            .list-card {
                box-shadow: none;
                padding: 20px 0;
            }
            .custom-table th, 
            .custom-table td {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body onload="enlistItems();">

    <div class="list-card">
        <div class="logo-container">
            <div class="logo-badge">T</div>
        </div>

        <h1 class="form-title">Item List</h1>
        <p class="form-subtitle"></p>

        <!-- Owner Header Line Above Table -->
        <div class="owner-banner">
            <div>
                <div class="label">User</div>
                <div class="user-name" id="billUser">Alex Morgan</div>
            </div>
            <span class="code-tag" id="itemCount">ID: #USR-1042</span>
        </div>

        <!-- Table View Component -->
        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Item Code</th>
                        <th>Item Name</th>
                        <th>Item Cost</th>
                    </tr>
                </thead>
                <tbody id="itemList">
                    <tr>
                        <td>Enterprise License</td>
                        <td><span class="code-tag">ITM-001</span></td>
                        <td>May 10, 2026</td>
                    </tr>
                    <tr>
                        <td>Cloud Storage (1TB)</td>
                        <td><span class="code-tag">ITM-002</span></td>
                        <td>Jun 18, 2026</td>
                    </tr>
                    <tr>
                        <td>Developer API Key</td>
                        <td><span class="code-tag">ITM-003</span></td>
                        <td>Jul 04, 2026</td>
                    </tr>
                    <tr>
                        <td>SSO Integration Pack</td>
                        <td><span class="code-tag">ITM-004</span></td>
                        <td>Aug 01, 2026</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="login-redirect" id="todaysDate">
            Need to manage permissions?
        </div>
    </div>
<script>
	async function enlistItems(){
		try {
				const querryString = window.location.search;
									    const querryParams = new URLSearchParams(querryString);
									    const billUserr = querryParams.get('billUser');
									
									
			     const url = new URL("/dashboard/loaditems", window.location.origin);
	//			 const url = new URL("/table21/dashboard/loaditems", window.location.origin);
			     url.search = new URLSearchParams({ billUser: billUserr }).toString();
			     const itemsListResponse = await fetch(url);
			     if (!itemsListResponse.ok) {
			         console.log(itemsListResponse.status + ": " + itemsListResponse.statusText);
			         // display custom dialog error
			     }
			     else {
			         const listOfItems = await itemsListResponse.json();
			         // retrive items list and populate in combo box
			         if (listOfItems.message === "Requested without authentication.") {
			             // display custom dialog error
			         }
			         else {
						console.log(listOfItems);
						const parentList = document.getElementById("itemList");
						 parentList.replaceChildren();
						              
						
			             for (let i = 0;i < listOfItems.length;i++) {
							const rowTr = document.createElement("tr");
							                    
							                   
							                    const td1 = document.createElement("td");
							                    td1.textContent = listOfItems[i].itemCode;
							                    const td2 = document.createElement("td");
							                   
												td2.textContent = listOfItems[i].itemName;
							                   
												 const td3 = document.createElement("td");
							                   td3.textContent=listOfItems[i].itemCost;
											   
							                    rowTr.appendChild(td1);
							                    rowTr.appendChild(td2);
							                    rowTr.appendChild(td3);
							                    parentList.appendChild(rowTr);
			             }
						 document.getElementById("todaysDate").innerText = new Date();
						 document.getElementById("billUser").innerText = billUserr;
						document.getElementById("itemCount").innerText = "Total Count: " + listOfItems.length;
			         }
			     }
			 }
			 catch (err) {
			     console.log(err);
			 }
	}
	</script>
</body>
</html>
