<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports</title>
    <style type="text/css">
        /* Color Palette mapped directly from the login page */
        :root {
            --bg-body: #f4f4f7;
            --bg-card: #ffffff;
            --bg-container: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --primary-accent: #65407D;
            --primary-hover: #523366;
            --focus-ring: rgba(101, 64, 125, 0.1);
            --shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
        }

        /* Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        a { 
            color: var(--text-secondary); 
            text-decoration: none; 
            transition: color 0.2s ease;
        }
        a:hover { 
            color: var(--primary-accent); 
            text-decoration: underline; 
        }

        /* Main Container Card */
        .reports-card {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-container);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header Section */
        .header-section {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header-section h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .header-section h2 {
            font-size: 14px;
            font-weight: normal;
            color: var(--text-secondary);
        }

        /* Profile/Email Section */
        .user-section {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        select, input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input[type="date"]:focus {
            border-color: var(--primary-accent);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        /* Date Picker Range Layout */
        .date-range {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .date-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .date-field span {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Action Button */
        .btn-fetch {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-fetch:hover {
            background-color: var(--primary-hover);
        }

        .btn-fetch:active {
            transform: scale(0.98);
        }

        /* Output Display Box */
        .output-box {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 100px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .output-title {
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .output-content {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-accent);
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                background: var(--bg-card);
            }
            .reports-card {
                box-shadow: none;
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>

    <main class="reports-card">
        <header class="header-section">
            <h1>Table21</h1>
            <h2>Reports</h2>
        </header>

        <section class="user-section">
            <span>email@id.com</span>
        </section>

        <form id="report-form" onsubmit="event.preventDefault();">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="item-select">Item Name</label>
                <select id="item-select" name="itemName">
                    <option value="" disabled selected>Select an item</option>
                </select>
            </div>

            <div class="date-range" style="margin-bottom: 15px;">
                <div class="date-field">
                    <span>From</span>
                    <input type="date" id="date-from" name="dateFrom">
                </div>
                <div class="date-field">
                    <span>To</span>
                    <input type="date" id="date-to" name="dateTo">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="report-select">Report</label>
                <select id="report-select" name="reportType">
                    <option selected>Select report type</option>
					<option>Total Income</option>
					<option>Lowest Bill Custom Date Range</option>
                </select>
            </div>

            <button type="submit" class="btn-fetch">Fetch</button>
        </form>

        <section class="output-box">
            <span class="output-title">Output</span>
            <div class="output-content">Number/Text</div>
        </section>
    </main>

</body>
</html>
