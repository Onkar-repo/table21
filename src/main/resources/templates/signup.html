<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign Up</title>
	<style>
		/* Signup Main Page */
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		body {
			background: #f4f4f7;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 20px;
		}

		/* Responsive Card Container */
		.login-card {
			background: #ffffff;
			width: 100%;
			max-width: 400px;
			/* Perfect desktop width */
			padding: 40px 30px;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2);
			text-align: center;
		}

		/* Logo Icon ("T") styling */
		.logo-container {
			display: flex;
			justify-content: center;
			margin-bottom: 24px;
		}

		.logo-badge {
			background: #65407D;
			/* Modern corporate indigo/blue */
			color: #ffffff;
			width: 60px;
			height: 60px;
			border-radius: 50%;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 28px;
			font-weight: bold;
			box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
		}

		/* Form Header Text */
		.form-title {
			font-size: 22px;
			font-weight: 700;
			color: #1f2937;
			margin-bottom: 8px;
		}

		.form-subtitle {
			font-size: 14px;
			color: #6b7280;
			margin-bottom: 24px;
		}

		/* Form Controls */
		.form-group {
			margin-bottom: 16px;
			text-align: left;
		}

		input[type="text"],
		input[type="email"],
		input[type="password"] {
			width: 100%;
			padding: 14px 16px;
			font-size: 16px;
			/* Prevents iOS auto-zoom on focus */
			border: 1px solid #d1d5db;
			border-radius: 8px;
			background-color: #f9fafb;
			transition: all 0.3s ease;
			outline: none;
		}

		input[type="text"]:focus,
		input[type="email"]:focus,
		input[type="password"]:focus {
			border-color: #65407D;
			background-color: #ffffff;
			box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
		}

		/* Primary Action Button (Sign Up) */
		.btn-primary {
			width: 100%;
			padding: 14px;
			background: #65407D;
			color: white;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.2s ease, transform 0.1s ease;
			margin-top: 10px;
		}

		.btn-primary:hover {
			background: #4338ca;
		}

		.btn-primary:active {
			transform: scale(0.98);
		}

		/* Redirection Footer Link */
		.login-redirect {
			display: inline-block;
			margin-top: 24px;
			color: #6b7280;
			font-size: 14px;
			text-decoration: none;
		}

		.login-redirect a {
			color: #65407D;
			text-decoration: none;
			font-weight: 600;
			cursor: pointer;
		}

		.login-redirect a:hover {
			text-decoration: underline;
		}

		/* Mobile specific adjustments */
		@media (max-width: 480px) {
			body {
				padding: 15px;
				background: #ffffff;
				/* Seamless full-bleed on mobile screens */
			}

			.login-card {
				box-shadow: none;
				padding: 20px 10px;
			}
		}
	</style>

	<style>
		/* Alert Box Dialog */
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		body {
			background: #f4f4f7;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 20px;
		}

		/* Demo Trigger Button Styling */
		.btn-trigger {
			padding: 14px 28px;
			background: #65407D;
			color: #ffffff;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 4px 12px rgba(101, 64, 125, 0.3);
			transition: background 0.2s ease, transform 0.1s ease;
		}

		.btn-trigger:hover {
			background: #523366;
		}

		.btn-trigger:active {
			transform: scale(0.98);
		}

		/* Modal Overlay */
		.dialog-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(31, 41, 55, 0.5);
			/* Semi-transparent dark backdrop */
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
			opacity: 0;
			visibility: hidden;
			transition: opacity 0.25s ease, visibility 0.25s ease;
			z-index: 1000;
		}

		.dialog-overlay.active {
			opacity: 1;
			visibility: visible;
		}

		/* Responsive Dialog Container */
		.dialog-card {
			background: #ffffff;
			width: 100%;
			max-width: 400px;
			padding: 32px 24px;
			border-radius: 12px;
			box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
			text-align: center;
			transform: scale(0.92);
			transition: transform 0.25s ease;
		}

		.dialog-overlay.active .dialog-card {
			transform: scale(1);
		}

		/* Alert Icon Badge ("!") */
		.dialog-icon-container {
			display: flex;
			justify-content: center;
			margin-bottom: 20px;
		}

		.dialog-icon-badge {
			background: #65407D;
			color: #ffffff;
			width: 56px;
			height: 56px;
			border-radius: 50%;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 26px;
			font-weight: bold;
			box-shadow: 0 4px 12px rgba(101, 64, 125, 0.3);
		}

		/* Dialog Header Text */
		.dialog-title {
			font-size: 20px;
			font-weight: 700;
			color: #1f2937;
			margin-bottom: 8px;
		}

		.dialog-subtitle {
			font-size: 14px;
			color: #6b7280;
			line-height: 1.5;
			margin-bottom: 24px;
		}

		/* Alert Action (Full-width single button) */
		.dialog-actions {
			display: flex;
		}

		.btn-dialog {
			width: 100%;
			padding: 12px;
			border-radius: 8px;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s ease;
			outline: none;
		}

		/* Primary Alert Button */
		.btn-primary {
			background: #65407D;
			color: #ffffff;
			border: 1px solid #65407D;
		}

		.btn-primary:hover {
			background: #523366;
			border-color: #523366;
		}

		.btn-primary:active {
			transform: scale(0.98);
		}

		/* Mobile Adjustments */
		@media (max-width: 480px) {
			.dialog-card {
				padding: 24px 18px;
			}
		}
	</style>

</head>

<body onLoad="document.getElementById('reg_username').focus()">

	<!-- Custom Alert Modal Container -->
	<div class="dialog-overlay" id="customAlertOverlay">
		<div class="dialog-card">
			<div class="dialog-icon-container">
				<div class="dialog-icon-badge">!</div>
			</div>

			<h2 class="dialog-title" id="alertTitle">Alert Title</h2>
			<p class="dialog-subtitle" id="alertMessage">This is an important alert notification message.</p>

			<div class="dialog-actions">
				<button class="btn-dialog btn-primary" id="alertOkBtn" onclick="closeAlert()">OK</button>
			</div>
		</div>
	</div>

	<!-- Signup Main Page Container -->
	<div class="login-card">
		<div class="logo-container">
			<div class="logo-badge">T</div>
		</div>

		<h1 class="form-title">Sign Up</h1>
		<p class="form-subtitle">Register to get started</p>
		<div class="form-group">
			<input type="text" placeholder="Name" id="reg_username" name="Username" autocomplete="username" />
		</div>

		<div class="form-group">
			<input type="email" placeholder="Email" id="reg_email" name="Email" autocomplete="email" />
		</div>

		<div class="form-group">
			<input type="password" placeholder="Password" id="reg_password" name="Password"
				autocomplete="new-password" />
		</div>

		<div class="form-group">
			<input type="password" placeholder="Confirm Password" id="reg_confirm_password" name="ConfirmPassword"
				autocomplete="new-password" />
		</div>

		<button class="btn-primary" onClick="validateSignUp();">Sign Up</button>
		<div class="login-redirect">
			Already have an account? <a href="index.html">Log In</a>
		</div>
	</div>

	<script>
	let errName;
		function clean() {
			document.getElementById("reg_username").value = "";
			document.getElementById("reg_email").value = "";
			document.getElementById("reg_password").value = "";
			document.getElementById("reg_confirm_password").value = "";
			document.getElementById("reg_username").focus();
		}

		async function SendData() {
			try {
				const userObject = {

					userName: document.getElementById('reg_username').value,
					userEmail: document.getElementById('reg_email').value,
					userPassword: document.getElementById('reg_password').value,
				};
				const userObjectJSON = JSON.stringify(userObject);
				const mhb = {
					method: 'POST',
					headers: {'Content-Type': 'Application/json', 'Access-Control-Allow-Origin': '*'},
					body: userObjectJSON
				};
				const signupResponse = await fetch("http://localhost:8080/signup", mhb);
				if (!signupResponse.ok)
					throw new Error(signupResponse.status + " occured.");
				const textResponse = await signupResponse.text();
				switch(textResponse)
				{
					case "saved":
					showAlert("Success","User registered successfully. Click login link to begin.");
					errName = 1;
					break;
					case "exists":
					showAlert("Failure","User with " + userObject.userEmail + " already exists.");
					errName = 2;
				}
				
			}
			catch (error) {
				console.log(error);
			}

		}

		function validateSignUp() {

			const un = document.getElementById('reg_username').value;
			const ue = document.getElementById('reg_email').value;
			const up = document.getElementById('reg_password').value;
			const ucp = document.getElementById('reg_confirm_password').value;

			if (un === "" || ue === "" || up === "" || ucp === "") {
				showAlert("Validation","All fields are compulsory. Fill up all.");
				errName = 3;
				//document.getElementById('reg_username').focus();
			}
			else if(!(document.getElementById('reg_email').checkValidity() && ue.split("@")[1].includes("."))){
				showAlert("Validation","Email id format is incorrect.");
				errName = 4;
			}
			else if (up !== ucp) {
			
				showAlert("Validation","Password confirmation does not match.");
				errName = 5;
			}
			else {
				SendData();
			}

		}
	</script>
		
	<script>
		/* Alert Box Script */
		
		function showAlert(title, message) {
			if (title) document.getElementById('alertTitle').innerText = title;
			if (message) document.getElementById('alertMessage').innerText = message;
			const overlay = document.getElementById('customAlertOverlay');
			overlay.classList.add('active');
			document.getElementById('alertOkBtn').focus();
		}

		function closeAlert() {
			const overlay = document.getElementById('customAlertOverlay');
			overlay.classList.remove('active');
			switch(errName)
			{
				case 1:
					clean();
					break;
				case 2:
					document.getElementById('reg_email').focus();
					break;
				case 3:
					document.getElementById('reg_username').focus();
					break;
				case 4:
					document.getElementById('reg_email').focus();
					break;
				case 5:
					document.getElementById('reg_confirm_password').focus();
			}
			errName = 0;
		}
		
		"abc@pqr".slice
		
	</script>
</body>

</html>
