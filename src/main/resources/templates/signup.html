<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign Up</title>
	<link rel="stylesheet" href="/table21/css/signup.css">
	<link rel="stylesheet" href="/table21/css/alert.css">

</head>

<body onLoad="document.getElementById('reg_username').focus()">

	<!-- Custom Loading Dialog Screen -->
			<div class="dialog-overlay" id="customLoadingOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(31, 41, 55, 0.5); display: flex; justify-content: center; align-items: center; padding: 20px; opacity: 1; visibility: visible; z-index: 1000; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
				
				<!-- Inline CSS for Keyframe Animation -->
				<style>
					@keyframes spin {
						0% { transform: rotate(0deg); }
						100% { transform: rotate(360deg); }
					}
				</style>

				<!-- Responsive Loading Card -->
				<div class="dialog-card" style="background: #ffffff; width: 100%; max-width: 400px; padding: 32px 24px; border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15); text-align: center; transform: scale(1); box-sizing: border-box;">
					
					<!-- Spinner Container -->
					<div class="dialog-icon-container" style="display: flex; justify-content: center; margin-bottom: 20px;">
						<div class="loading-spinner" style="width: 48px; height: 48px; border: 4px solid rgba(101, 64, 125, 0.15); border-top: 4px solid #65407D; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
					</div>

					<!-- Dialog Header Text -->
					<h2 class="dialog-title" id="loadingTitle" style="font-size: 20px; font-weight: 700; color: #1f2937; margin: 0 0 8px 0;">Please Wait...</h2>
					<p class="dialog-subtitle" id="loadingMessage" style="font-size: 14px; color: #6b7280; line-height: 1.5; margin: 0;">We are processing your request. This will only take a moment.</p>

				</div>
			</div>
			<!-- ------------------------------ -->

	
	<!-- Custom Alert Modal Container -->
	<div class="dialog-overlay" id="customAlertOverlay">
		<div class="dialog-card">
			<div class="dialog-icon-container">
				<div class="dialog-icon-badge">!</div>
			</div>

			<h2 class="dialog-title" id="alertTitle">Alert Title</h2>
			<p class="dialog-subtitle" id="alertMessage">This is an important alert notification message.</p>

			<div class="dialog-actions">
				<button class="btn-dialog btn-primary" id="alertOkBtn" onclick="closeAlert()">OK</button>
			</div>
		</div>
	</div>

	<!-- Signup Main Page Container -->
	<div class="login-card">
		<div class="logo-container">
			<div class="logo-badge">T</div>
		</div>

		<h1 class="form-title">Sign Up</h1>
		<p class="form-subtitle">Register to get started</p>
		<div class="form-group">
			<input type="text" placeholder="Name" id="reg_username" name="Username" autocomplete="username" />
		</div>

		<div class="form-group">
			<input type="email" placeholder="Email" id="reg_email" name="Email" autocomplete="email" />
		</div>

		<div class="form-group">
			<input type="password" placeholder="Set Password" id="reg_password" name="Password"
				autocomplete="new-password" />
		</div>

		<div class="form-group">
			<input type="password" placeholder="Confirm Password" id="reg_confirm_password" name="ConfirmPassword"
				autocomplete="new-password" />
		</div>

		<button class="btn-primary" onClick="validateSignUp();">Sign Up</button>
		<div class="login-redirect">
			Already have an account? <a href="/table21/login">Log In</a>
		</div>
	</div>

	<script type="text/javascript" src="/table21/js/signup.js"> </script>
</body>

</html>
