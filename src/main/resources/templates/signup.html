<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign Up</title>
	<link rel="stylesheet" href="/css/signup.css">
	<link rel="stylesheet" href="/css/alert.css">

</head>

<body onLoad="document.getElementById('reg_username').focus()">

	<!-- Custom Alert Modal Container -->
	<div class="dialog-overlay" id="customAlertOverlay">
		<div class="dialog-card">
			<div class="dialog-icon-container">
				<div class="dialog-icon-badge">!</div>
			</div>

			<h2 class="dialog-title" id="alertTitle">Alert Title</h2>
			<p class="dialog-subtitle" id="alertMessage">This is an important alert notification message.</p>

			<div class="dialog-actions">
				<button class="btn-dialog btn-primary" id="alertOkBtn" onclick="closeAlert()">OK</button>
			</div>
		</div>
	</div>

	<!-- Signup Main Page Container -->
	<div class="login-card">
		<div class="logo-container">
			<div class="logo-badge">T</div>
		</div>

		<h1 class="form-title">Sign Up</h1>
		<p class="form-subtitle">Register to get started</p>
		<div class="form-group">
			<input type="text" placeholder="Name" id="reg_username" name="Username" autocomplete="username" />
		</div>

		<div class="form-group">
			<input type="email" placeholder="Email" id="reg_email" name="Email" autocomplete="email" />
		</div>

		<div class="form-group">
			<input type="password" placeholder="Password" id="reg_password" name="Password"
				autocomplete="new-password" />
		</div>

		<div class="form-group">
			<input type="password" placeholder="Confirm Password" id="reg_confirm_password" name="ConfirmPassword"
				autocomplete="new-password" />
		</div>

		<button class="btn-primary" onClick="validateSignUp();">Sign Up</button>
		<div class="login-redirect">
			Already have an account? <a href="index.html">Log In</a>
		</div>
	</div>

	<script type="text/javascript" src="/js/signup.js"> </script>
</body>

</html>
